spring:
  application:
    name: backend
  jackson:
    time-zone: Asia/Shanghai
  config:
    # 本机私人配置（数据库密码等），放在 backend/application-local.yaml，已被 .gitignore 忽略
    import: optional:file:./application-local.yaml
  datasource:
    # 本机默认连服务器上的开发库 app_dev；服务器上由环境变量覆盖成线上库 app
    url: ${DB_URL:jdbc:mysql://47.108.234.233:3306/app_dev?sslMode=REQUIRED&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:app_dev}
    # 开发库密码不进仓库：写在 backend/application-local.yaml（找组长要）
    password: ${DB_PASSWORD}
    hikari:
      # 多人共用一个库：每人最多 10 个连接，MySQL 上限 100
      maximum-pool-size: 10
      minimum-idle: 1

  servlet:
    multipart:
      # 文档上传：单个文件 20MB（nginx 的 client_max_body_size 要大于这个）
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}

app:
  storage:
    # 文档文件存 S3 协议的对象存储（自建 MinIO、阿里云 OSS、腾讯 COS 都行）。本机默认值连开发环境的开发桶，
    # 服务器上用环境变量改成线上的；密钥不进仓库，开发密钥写在 backend/application-local.yaml
    endpoint: ${OSS_ENDPOINT:http://127.0.0.1:9000}
    bucket: ${OSS_BUCKET:app-dev}
    access-key: ${OSS_ACCESS_KEY:unset}
    secret-key: ${OSS_SECRET_KEY:unset}
    region: ${OSS_REGION:us-east-1}
    # MinIO 要用路径风格；阿里云 OSS、腾讯 COS 设为 false
    path-style: ${OSS_PATH_STYLE:true}
  jwt:
    # 没配就每次启动随机生成（重启后需重新登录）；线上必须用环境变量固定
    secret: ${JWT_SECRET:}
    # 有效期（秒），7 天
    expires-in: 604800
  admin:
    # 用户表为空时自动创建的初始管理员；线上用环境变量覆盖密码
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:123456}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
