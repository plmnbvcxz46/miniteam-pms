spring:
  application:
    name: backend
  jackson:
    time-zone: Asia/Shanghai
  config:
    # 本机私人配置（数据库密码等），放在 backend/application-local.yaml，已被 .gitignore 忽略
    import: optional:file:./application-local.yaml
  datasource:
    # 本机默认连服务器上的开发库 app_dev；服务器上由环境变量覆盖成线上库 app
    url: ${DB_URL:jdbc:mysql://47.108.234.233:3306/app_dev?sslMode=REQUIRED&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:app_dev}
    # 开发库密码不进仓库：写在 backend/application-local.yaml（找组长要）
    password: ${DB_PASSWORD}
    hikari:
      # 多人共用一个库：每人最多 10 个连接，MySQL 上限 100
      maximum-pool-size: 10
      minimum-idle: 1

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # 没配就每次启动随机生成（重启后需重新登录）；线上必须用环境变量固定
    secret: ${JWT_SECRET:}
    # 有效期（秒），7 天
    expires-in: 604800
  admin:
    # 用户表为空时自动创建的初始管理员；线上用环境变量覆盖密码
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:123456}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
