      - myPermissions
      - createdAt
    ProjectSave:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date
          example: '2026-10-22'
        planEnd:
          type: string
          format: date
          example: '2026-10-22'
      required:
      - name
      - startDate
      - planEnd
    Priority:
      type: object
      properties:
        label:
          type: string
          description: 高 / 中 / 低
          example: 高
        score:
          type: number
          description: 0-100
          example: 86
      required:
      - label
      - score
    HeadlineBlock:
      type: object
      properties:
        title:
          type: string
          example: 接口文档逾期两天，两项任务因此受阻
        risk:
          type: boolean
          description: true 橙色风险块，false 黑色
        delayDays:
          type: integer
          format: int32
          description: 预测延期天数
        plannedEnd:
          type: string
          format: date
          example: '2026-10-22'
        predictedEnd:
          type: string
          format: date
          example: '2026-10-22'
        blockedTasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskRef'
          description: 受阻任务
        targetTaskId:
          type: integer
          format: int64
          nullable: true
          description: 「查看」跳转的任务
