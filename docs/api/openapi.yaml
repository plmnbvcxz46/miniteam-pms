      - title
      - start
      - end
      - status
    ScheduleRow:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserBrief'
        bars:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleBar'
      required:
      - user
      - bars
    TodoItem:
      type: object
      properties:
        task:
          $ref: '#/components/schemas/TaskRef'
        dueDate:
          type: string
          format: date
          example: '2026-10-22'
          nullable: true
        score:
          type: number
          description: 优先级得分
        dueTag:
          type: string
          description: 逾期 / 今天 / 周几 / 下周几
          example: 今天
        overdueDays:
          type: integer
          format: int32
      required:
      - task
      - dueDate
      - score
      - dueTag
      - overdueDays
    CriticalNode:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
        label:
          type: string
