openapi: 3.0.3
info:
  title: miniteam-pms
  version: 0.1.0
  description: '小型软件团队项目管理系统接口。


    - 鉴权：除登录、注册外，请求头带 `Authorization: Bearer <token>`。

    - 响应：`{ "code": 200, "message": "ok", "data": ... }`，出错时 HTTP 状态码与 `code` 一致。

    - 时间：日期 `yyyy-MM-dd`，时间 `yyyy-MM-dd HH:mm:ss`，时区 Asia/Shanghai。

    - 分页：`page` 从 1 开始，`size` 默认 20，返回 `{ total, list }`。


    | code | 含义 |

    |---|---|

    | 200 | 成功 |

    | 400 | 参数错误 |

    | 401 | 未登录或登录已过期 |

    | 403 | 无权限 |

    | 404 | 不存在 |

    | 409 | 业务冲突（依赖成环、仍被引用、重复） |

    | 500 | 服务器错误 |

    '
servers:
- url: /api
  description: 相对路径，开发时由 Vite 代理
- url: http://47.108.234.233/api
  description: 线上
tags:
- name: 认证
- name: 用户管理
- name: 角色权限
- name: 项目
- name: 成员
- name: 里程碑
- name: 任务
- name: 依赖
- name: 进度
- name: 统计报表
- name: 团队协作
- name: 缺陷
- name: 文档
- name: 通知
- name: 往期日报
- name: 系统管理
security:
