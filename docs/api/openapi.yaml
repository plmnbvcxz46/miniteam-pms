            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Result'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginResult'
                  required:
                  - data
        default:
          $ref: '#/components/responses/Error'
      security: []
  /auth/register:
