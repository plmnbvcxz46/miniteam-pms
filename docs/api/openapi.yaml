                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/DictItem'
                  required:
                  - data
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - 系统管理
      summary: 删除字典项
      operationId: deleteDict
      parameters:
      - name: dictId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        default:
          $ref: '#/components/responses/Error'
  /configs:
    get:
      tags:
      - 系统管理
      summary: 系统参数
      operationId: listConfigs
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Result'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ConfigItem'
                  required:
                  - data
        default:
          $ref: '#/components/responses/Error'
  /configs/{key}:
    put:
      tags:
      - 系统管理
      summary: 修改参数
      operationId: updateConfig
      description: 四个优先级权重之和须为 1，否则返回 400。
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Result'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ConfigItem'
                  required:
                  - data
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: 错误，code 见说明
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
  schemas:
    Result:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: 200 成功，其余见错误码
          example: 200
        message:
          type: string
          example: ok
        data:
          nullable: true
          description: 业务数据
      required:
      - code
      - message
      description: 统一响应体
    TaskStatus:
      type: string
      enum:
      - TODO
      - DOING
      - BLOCKED
      - DONE
      description: TODO 待开始 / DOING 进行中 / BLOCKED 阻塞 / DONE 已完成
    ProjectStatus:
      type: string
      enum:
      - ACTIVE
      - ARCHIVED
      description: ACTIVE 进行中 / ARCHIVED 已归档
    ProjectRole:
      type: string
      enum:
      - PM
      - MEMBER
      - TESTER
      description: PM 项目经理 / MEMBER 普通成员 / TESTER 测试人员
    MilestoneStatus:
      type: string
      enum:
      - PENDING
      - DONE
      description: PENDING 未完成 / DONE 已完成
    DocStatus:
      type: string
      enum:
      - REVISING
      - FINAL
      description: REVISING 修订中 / FINAL 定稿
    DefectStatus:
      type: string
      enum:
      - PENDING
      - FIXED
      - CLOSED
      description: PENDING 待确认 / FIXED 已修复 / CLOSED 已关闭
    DefectSeverity:
      type: string
      enum:
      - FATAL
      - SEVERE
      - NORMAL
      - MINOR
      description: FATAL 致命 / SEVERE 严重 / NORMAL 一般 / MINOR 轻微
    NotificationType:
      type: string
      enum:
      - ASSIGN
      - MENTION
      - DELAY
      - DEFECT
      - SYSTEM
      description: ASSIGN 指派 / MENTION 被@ / DELAY 延期预警 / DEFECT 缺陷 / SYSTEM 系统
    UserBrief:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          description: 账号
        realName:
          type: string
          description: 姓名
      required:
      - id
      - username
      - realName
    TaskRef:
      type: object
      properties:
        id:
          type: integer
          format: int64
        taskNo:
          type: integer
          format: int32
          description: 项目内编号，显示为 T-编号
        title:
          type: string
      required:
      - id
      - taskNo
      - title
    ProjectRef:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      required:
      - id
      - name
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - username
      - password
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        realName:
          type: string
      required:
      - username
      - password
      - realName
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        realName:
          type: string
        dept:
          type: string
          nullable: true
          description: 部门/小组
        roleId:
          type: integer
          format: int64
        roleCode:
          type: string
          example: PM
        roleName:
          type: string
          example: 项目经理
        email:
          type: string
          nullable: true
        skillTags:
          type: array
          items:
            type: string
          description: 技能标签
        weeklyCapacity:
          type: integer
          format: int32
          description: 每周工时上限（小时）
        status:
          type: integer
          format: int32
          description: 1 启用 0 停用
        lastLoginAt:
          type: string
          example: '2026-10-22 09:30:00'
          description: yyyy-MM-dd HH:mm:ss
          nullable: true
        createdAt:
          type: string
          example: '2026-10-22 09:30:00'
          description: yyyy-MM-dd HH:mm:ss
      required:
      - id
      - username
      - realName
      - dept
      - roleId
      - roleCode
      - roleName
      - email
      - skillTags
      - weeklyCapacity
      - status
      - lastLoginAt
      - createdAt
    CurrentUser:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        permissions:
          type: array
          items:
            type: string
          description: 系统权限编码
      required:
