        title:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        overrunDays:
          type: integer
          format: int32
          description: 预计超期天数
      required:
      - taskId
      - label
      - title
      - status
      - overrunDays
    Overview:
      type: object
      properties:
        issueNo:
          type: integer
          format: int32
        date:
          type: string
          format: date
