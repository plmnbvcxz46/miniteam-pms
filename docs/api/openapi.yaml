      - title
      - risk
      - delayDays
      - plannedEnd
      - predictedEnd
      - blockedTasks
      - targetTaskId
    ScheduleBar:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
        title:
          type: string
        start:
          type: string
          format: date
          example: '2026-10-22'
        end:
          type: string
          format: date
          example: '2026-10-22'
