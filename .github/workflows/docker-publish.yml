name: 发布镜像

# 自动部署（“部署”工作流）成功之后才构建，所以不会和 PR 的检查抢资源，也不会发布一个编译不过的版本。
# 镜像推到 GitHub 的镜像仓库 ghcr.io，供 deploy/docker-compose.yml 自部署用。
on:
  workflow_run:
    workflows: ["部署"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: docker-publish

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # 手动触发总是跑；自动触发只在“部署”成功时跑
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: deploy/backend.Dockerfile
          - name: frontend
            dockerfile: deploy/frontend.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          # 自动触发时取“部署”那次提交，手动触发取当前分支
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像名（owner 必须小写）
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/miniteam-pms-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
